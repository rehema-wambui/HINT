<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HINT – Youth Sign Up</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="logo.jpg" alt="HINT Logo" class="site-logo">
        <div class="brand-text">
          <h1>HINT</h1>
          <span class="tagline">Connecting Youth to Work</span>
        </div>
      </div>
    </div>
  </header>

  <!-- SIGNUP WRAPPER -->
  <main class="signup-container">
    <div class="signup-box">
      <h2>Create Your Youth Account</h2>
      <p class="subtitle">Join HINT and unlock opportunities.</p>

      <form id="signupForm">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>

        <p class="switch">
          Already have an account? <a href="youth-login.html">Log In</a>
        </p>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        <img src="logo.jpg" class="footer-logo" alt="HINT Logo">
        <p>© 2025 HINT. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="signup.js"></script>
</body>
</html>
