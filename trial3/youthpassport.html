<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Passport – HINT</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="youthpassport.css"/>
</head>
<body>
  <header>
    <img src="logo.jpg" alt="HINT Logo" class="logo"/>
    <h1>Your <span>Digital Passport</span></h1>
  </header>

  <section class="passport-container">
    <div class="passport-card">
      <h2 id="userName"></h2>
      <p><strong>Age:</strong> <span id="userAge"></span></p>
      <p><strong>Gender:</strong> <span id="userGender"></span></p>
      <p><strong>Location:</strong> <span id="userLocation"></span></p>
      <p><strong>Email:</strong> <span id="userEmail"></span></p>
      <p><strong>Phone:</strong> <span id="userPhone"></span></p>

      <h3>🎓 Education</h3>
      <p id="eduList"></p>

      <h3>💼 Work History</h3>
      <p id="workList"></p>

      <h3>📂 Portfolio</h3>
      <p id="portfolioList"></p>

      <h3>💰 Finance (Optional)</h3>
      <p><strong>Mobile Money:</strong> <span id="userFinance"></span></p>
      <p><strong>Savings/Chama:</strong> <span id="userSavings"></span></p>

      <h3>✅ Referee</h3>
      <p><span id="userReferee"></span></p>
    </div>
  </section>

  <footer>
    <p>© 2025 HINT – Empowering African Youth</p>
  </footer>

  <script src="youthPassport.js"></script>
</body>
</html>
