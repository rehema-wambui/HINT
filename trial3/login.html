<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HINT – Log In</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="logo.jpg" alt="HINT Logo" class="site-logo">
        <div class="brand-text">
          <h1>HINT</h1>
          <span class="tagline">Digital Passport for Youth</span>
        </div>
      </div>
    </div>
  </header>

  <!-- LOGIN WRAPPER -->
  <main class="login-container">
    <div class="login-box">
      <h2>Welcome Back</h2>
      <p class="subtitle">Log in to access your Digital Passport.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="identifier">Email or Phone</label>
          <input type="text" id="identifier" name="identifier" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn-primary">Log In</button>

        <p class="forgot"><a href="#">Forgot Password?</a></p>

        <p class="switch">
          Don’t have an account? <a href="signup.html">Sign Up</a>
        </p>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-left">
        <img src="logo.jpg" class="footer-logo" alt="HINT Logo">
        <p>© 2025 HINT. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="login.js"></script>
</body>
</html>
